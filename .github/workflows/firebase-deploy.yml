name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: 18

      # ใช้ npm install แทน npm ci เพื่อป้องกันปัญหานี้
      - run: npm install

      # รันการ build สำหรับ web
      - run: npx expo export --platform web

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KANOM_COST_APP }}'
          channelId: live
          projectId: kanom-cost-app
